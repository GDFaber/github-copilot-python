<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint-button">Hint</button>
    <label class="difficulty-control" for="difficulty-select">Difficulty
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <label class="theme-control" for="theme-select">Theme
      <select id="theme-select" aria-label="Color theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="system" selected>System</option>
      </select>
    </label>
    <span id="hint-count">Hints used: 0</span>
    <span id="message"></span>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
